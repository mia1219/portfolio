<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Coffee</title>
    <link href="css/destyle.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
</head>

<body>
    <!-- header -->
    <header class="header">
        <h1 class="logo">
            <a href="#"><img src="img/logo.png" alt="title"></a>
        </h1>
        <!--画像-->
        <img src="img/main-visual.svg" alt="ヘッダー" class="image">
    </header>
    <!-- /header -->
    <!--メイン-->
    <main>
        <!--ナビゲーション-->
        <nav>
            <ul class="menu">
                <li>menu</li>
                <li>blog</li>
                <li>access</li>
            </ul>
        </nav>
        <!--コンセプト-->
        <div class="card-container">
            <div class="card-img">
                <img src="img/concept.svg" alt="コンセプト">
            </div>
            <div class="card-text">
                <p>Concept</p>
                <p class="card_title">心静かにコーヒーを</p>
                <p>立ち止まって、</p>
                <p>空の青さを眺めて、</p>
                <p>一息つきましょう</p>
            </div>
        </div>
        <!--blog-->
        <h2 class="title">blog</h2>
        <p class="ruby">ブログ</p>
        <div class="blog-container">
            <div class="card">
                <img src="img/thumbnail01.svg" alt="コーヒーカー">
                <p class="card_texttitle">コーヒーカー始めました。</p>
                <p class="card_text">2030.08.08</p>
            </div>
            <div class="card">
                <img src="img/thumbnail02.svg" alt="ミルク">
                <p class="card_texttitle">濃厚クリーミーなミルクをどうぞ</p>
                <p class="card_text">2030.08.05</p>
            </div>
            <div class="card">
                <img src="img/thumbnail03.svg" alt="オリジナル曲">
                <p class="card_texttitle">Sky Coffeeのオリジナル曲が完成！無料ダウンロード可能です。</p>
                <p class="card_text">2030.08.02</p>
            </div>
            <div class="card">
                <img src="img/thumbnail04.svg" alt="ハイキング">
                <p class="card_texttitle">バイキング用のコーヒーを販売中です</p>
                <p class="card_text">2030.07.28</p>
            </div>
            <div class="card">
                <img src="img/thumbnail05.svg" alt="ショップ">
                <p class="card_texttitle">ショップの壁を塗ってみました。</p>
                <p class="card_text">2030.07.27</p>
            </div>
            <div class="card">
                <img src="img/thumbnail06.svg" alt="ブログ">
                <p class="card_texttitle">ブログを始めました。</p>
                <p class="card_text">2030.07.26</p>
            </div>
        </div>
        <!--ボタン-->
        <div class="btn-container">
            <a href="" class="blog_btn">ブログ一覧</a>
        </div>
    </main>
    <!--フッター-->
    <footer>
        <img src="img/logo-white.svg" alt="ロゴ" class="footer_logo">
        <p class="copy">&copy; Sky Coffee</p>
    </footer>
</body>

</html>
